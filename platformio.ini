; Moonshot Avionics — PlatformIO configuration
;
; ===================== ENVIRONMENT NAMING =====================
; <role>_<board family><revision>
;   moonshot_*  = rocket / flight unit firmware  (rocket_avionics/)
;   moonbase_*  = base station / relay firmware  (base_station/)
;
;   moonshot_trackerv1    Heltec Wireless Tracker V1.1   COM13   PRIMARY FLIGHT UNIT
;   moonbase_lora32v43    Heltec WiFi LoRa 32 V4.3       COM999  PRIMARY BASE STATION — SET PORT
;   moonbase_trackerv1    Heltec Wireless Tracker V1.1   COM999  board lost
;   moonbase_lora32v41    Heltec WiFi LoRa 32 V4.1/V4.2  COM999  not in use
;   moonshot_lora32v43    Heltec WiFi LoRa 32 V4.3       COM999  no carrier board exists
;
; ===================== COM PORTS =====================
; Every environment declares an explicit upload_port. An environment whose
; board is not currently in use is pinned to COM999, which does not exist, so
; an accidental upload fails with "port not found" instead of writing the wrong
; firmware to a real board. Uploading everything at once is therefore safe:
; only boards with a real port assigned can be written.
;
; To bring a board into use: plug it in, run the "List serial devices" task
; (Ctrl+Shift+P -> Tasks: Run Task), and replace COM999 below with the port it
; reports. That is the only place the port needs to change — flash_and_monitor.ps1
; reads it from here.
;
; V4.1/V4.2 and V4.3 are NOT interchangeable — the FEM part changed and the
; control lines moved. Check the board silkscreen. See common/board_config.h.
;
; Common workflows:
;   Upload firmware:        pio run -e moonbase_lora32v43 -t upload
;   Upload LittleFS only:   pio run -e moonbase_lora32v43 -t uploadfs
;   Build only (get .bin):  pio run -e moonbase_lora32v43
;   Serial monitor:         pio device monitor -e moonbase_lora32v43
;
; Firmware .bin lands in .pio/build/<env>/firmware.bin
;
; LittleFS workflow (base station web dashboard — WiFi AP fallback only):
;   1. .\base_station\compress_web.ps1    (compress docs/ -> base_station/data/)
;   2. pio run -e <moonbase env> -t uploadfs

[platformio]
; No default_envs — always specify explicitly to avoid accidental uploads to wrong board.
; Default board (Wireless Tracker V1.1, 8MB flash) is set in [env]; LoRa32 envs override it.
;
; src_dir points to the repo root so build_src_filter can select either sketch folder.
src_dir = .
; data_dir for LittleFS upload (moonbase envs only).
data_dir = base_station/data

; ===================== SHARED SETTINGS =====================
[env]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino

; Custom board definition in boards/heltec_wireless_tracker.json.
; The variant (variants/heltec_wireless_tracker/pins_arduino.h in the PIO
; framework packages) defines no pin aliases — LED_BUILTIN, SS, MOSI etc.
; do not exist and will cause a compile error if used. All pin assignments
; live in common/board_config.h.
board = heltec_wireless_tracker

; Arduino IDE uses gnu++17 by default for ESP32; PIO defaults to gnu++11.
; build_unflags removes the default so build_flags can set gnu++17.
build_unflags = -std=gnu++11 -Os
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -O2

board_build.flash_mode = qio
board_upload.flash_size = 8MB

monitor_speed = 2000000
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

; NimBLE extended-advertising settings, shared by both roles.
[nimble]
build_flags =
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=254

; LoRa32 V4 family: ESP32-S3R2, 16MB external flash. Board JSON in boards/.
[lora32v4]
board = heltec_wifi_lora_32_v4
board_upload.flash_size = 16MB

; ===================== ROCKET / FLIGHT UNIT =====================

[env:moonshot_trackerv1]
; Include only rocket_avionics/ source files.
; The .ino has #include <Arduino.h> so PIO compiles it as a regular C++ file.
build_src_filter = -<*> +<rocket_avionics/>
board_build.partitions = rocket_avionics/partitions.csv
upload_port = COM13
monitor_port = COM13
build_flags =
    ${env.build_flags}
    ${nimble.build_flags}
    -DBOARD_TRACKER_V1

lib_deps =
    jgromes/RadioLib @ ^7.1.0
    Wire
    Preferences
    h2zero/NimBLE-Arduino @ 2.3.9

[env:moonshot_lora32v43]
extends = env:moonshot_trackerv1
board = ${lora32v4.board}
board_upload.flash_size = ${lora32v4.board_upload.flash_size}
board_build.partitions = rocket_avionics/partitions_16mb.csv
; No carrier board exists for a flight unit on this hardware — pinned unreachable.
upload_port = COM999
monitor_port = COM999
build_flags =
    ${env.build_flags}
    ${nimble.build_flags}
    -DBOARD_LORA32_V4_3

; ===================== BASE STATION / RELAY =====================

[env:moonbase_trackerv1]
build_src_filter = -<*> +<base_station/>
board_build.partitions = base_station/partitions.csv
board_build.filesystem = littlefs
; This board was lost — pinned unreachable.
upload_port = COM999
monitor_port = COM999
build_flags =
    ${env.build_flags}
    ${nimble.build_flags}
    -DBOARD_TRACKER_V1

lib_deps =
    jgromes/RadioLib @ ^7.1.0
    esp32async/ESPAsyncWebServer @ ^3.10.3
    h2zero/NimBLE-Arduino @ 2.3.9

[env:moonbase_lora32v43]
extends = env:moonbase_trackerv1
board = ${lora32v4.board}
board_upload.flash_size = ${lora32v4.board_upload.flash_size}
board_build.partitions = base_station/partitions_16mb.csv
; >>> SET THESE <<< Plug the V4.3 in, run the "List serial devices" task, and
; put the port it reports on both lines below. Nothing else needs changing.
upload_port = COM999
monitor_port = COM999
build_flags =
    ${env.build_flags}
    ${nimble.build_flags}
    -DBOARD_LORA32_V4_3

[env:moonbase_lora32v41]
extends = env:moonbase_lora32v43
; Ports are re-declared rather than inherited: if they were left to `extends`,
; setting the V4.3 port above would silently point this environment at the
; V4.3 board too, and V4.1 firmware on a V4.3 board drives the wrong FEM pins.
upload_port = COM999
monitor_port = COM999
build_flags =
    ${env.build_flags}
    ${nimble.build_flags}
    -DBOARD_LORA32_V4_1
